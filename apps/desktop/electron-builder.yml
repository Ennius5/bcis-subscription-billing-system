# Windows installer for the office PCs: `pnpm --filter @bcis/desktop dist`
# Output: apps/desktop/release/BCIS-Billing-Setup-<version>.exe (release/ is gitignored).
appId: ph.lab.bcis.billing
productName: BCIS Billing
copyright: BCIS lab project

directories:
  output: release

# electron-vite already bundled main, preload and renderer into out/; React, fonts and the
# shared rules are inside those bundles, so no node_modules are packed.
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
# Reuse the Electron already installed instead of downloading it again.
electronDist: node_modules/electron/dist

win:
  target:
    - target: nsis
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: BCIS Billing
  artifactName: BCIS-Billing-Setup-${version}.${ext}
  # Each PC keeps its saved server address (config.json in the app's data folder) across updates.
  deleteAppDataOnUninstall: false
